    <style>
        /* The vertical line of the timeline and the dot of each entry */
        .year-block { position: relative; padding-left: 28px; }
        .year-block::before {
            content: ""; position: absolute; left: 7px; top: 14px; bottom: -32px;
            width: 2px; background: rgb(30 41 59);
        }
        .year-block:last-child::before { bottom: 0; }
        .year-dot {
            position: absolute; left: 0; top: 8px; width: 16px; height: 16px; border-radius: 9999px;
            background: rgb(2 6 23); border: 3px solid rgb(236 72 153);
        }
        .cert { transition: border-color .15s ease, background-color .15s ease; }
        .cert:hover { border-color: rgb(236 72 153 / .6); background-color: rgb(30 41 59 / .8); }
        .cert.has-scan { cursor: zoom-in; }
        .chip[aria-pressed="true"] { background: rgb(236 72 153); border-color: rgb(236 72 153); color: #fff; }
        #lightbox { display: none; }
        #lightbox.show { display: flex; }
    </style>
</head>

        (function () {
            var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            var timeline = document.getElementById('timeline');
            var filters = document.getElementById('filters');
            var active = 'all';

            function el(tag, cls, text) {
                var e = document.createElement(tag);
                if (cls) e.className = cls;
                if (text !== undefined) e.textContent = text;
                return e;
            }

            function year(c) { return c.date.slice(0, 4); }

            // '2010-04-15' -> '15 Apr', '2021-07' -> 'Jul', '2024' -> ''
            function dayLabel(c) {
                var p = c.date.split('-');
                if (p.length === 1) return '';
                var m = MONTHS[parseInt(p[1], 10) - 1];
                return p.length === 3 ? parseInt(p[2], 10) + ' ' + m : m;
            }

            CERTS.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });

            // Header numbers
            var years = CERTS.map(year).map(Number);
            var first = Math.min.apply(null, years), last = Math.max.apply(null, years);
            document.getElementById('stat-count').textContent = CERTS.length;
            document.getElementById('stat-years').textContent = last - first;
            document.getElementById('stat-span').textContent = first + ' — ' + last;
            var issuers = {};
            CERTS.forEach(function (c) { issuers[c.issuer.split(' · ')[0]] = true; });
            document.getElementById('stat-issuers').textContent = Object.keys(issuers).length;

            // Filter chips
            function chip(key, label, count, icon) {
                var b = el('button', 'chip text-xs font-bold px-3 py-1.5 rounded-full border border-slate-700 bg-slate-800/60 text-slate-300 hover:border-pink-500 transition');
                b.type = 'button';
                b.setAttribute('aria-pressed', key === active ? 'true' : 'false');
                if (icon) { b.appendChild(el('i', 'fas ' + icon + ' mr-1.5')); }
                b.appendChild(document.createTextNode(label + ' '));
                b.appendChild(el('span', 'opacity-60 font-normal', String(count)));
                b.addEventListener('click', function () { active = key; render(); });
                return b;
            }

            function card(c) {
                var t = TOPICS[c.topic];
                var d = el('div', 'cert bg-slate-800/40 p-3 rounded-lg border border-slate-800 text-xs');
                var top = el('div', 'flex justify-between items-center gap-2 mb-1.5');
                var badge = el('span', 'text-[9px] px-1.5 py-0.5 rounded-full font-bold border ' + t.badge);
                badge.appendChild(el('i', 'fas ' + t.icon + ' mr-1'));
                badge.appendChild(document.createTextNode(t.label));
                top.appendChild(badge);
                top.appendChild(el('span', 'text-[10px] text-slate-500 font-semibold whitespace-nowrap', dayLabel(c)));
                d.appendChild(top);
                d.appendChild(el('span', 'font-bold text-white block text-[13px] leading-snug', c.title));
                d.appendChild(el('span', 'text-slate-400 text-[11px] block mt-0.5', c.issuer));
                if (c.note) d.appendChild(el('span', t.text + ' text-[10px] block mt-1', c.note));
                if (c.url) {
                    var a = el('a', 'inline-block mt-1.5 text-[10px] font-semibold text-slate-400 hover:text-pink-400 underline decoration-slate-600');
                    a.href = c.url; a.target = '_blank'; a.rel = 'noopener';
                    a.appendChild(el('i', 'fas fa-arrow-up-right-from-square mr-1'));
                    a.appendChild(document.createTextNode('Verify certificate'));
                    a.addEventListener('click', function (e) { e.stopPropagation(); });
                    d.appendChild(a);
                }
                if (c.scan) {
                    d.classList.add('has-scan');
                    d.tabIndex = 0;
                    d.setAttribute('role', 'button');
                    d.appendChild(el('span', 'text-slate-500 text-[10px] block mt-1.5')).innerHTML = '<i class="fas fa-image mr-1"></i>View certificate';
                    var open = function () { showScan(c); };
                    d.addEventListener('click', open);
                    d.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
                }
                return d;
            }

            function render() {
                filters.replaceChildren();
                filters.appendChild(chip('all', 'All', CERTS.length));
                Object.keys(TOPICS).forEach(function (k) {
                    var n = CERTS.filter(function (c) { return c.topic === k; }).length;
                    if (n) filters.appendChild(chip(k, TOPICS[k].label, n, TOPICS[k].icon));
                });

                timeline.replaceChildren();
                var shown = CERTS.filter(function (c) { return active === 'all' || c.topic === active; });
                document.getElementById('empty').classList.toggle('hidden', shown.length > 0);
                var block = null, grid = null, current = null;
                shown.forEach(function (c) {
                    if (year(c) !== current) {
                        current = year(c);
                        block = el('section', 'year-block');
                        block.appendChild(el('span', 'year-dot'));
                        block.appendChild(el('h2', 'font-black text-2xl text-white mb-3', current));
                        grid = el('div', 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3');
                        block.appendChild(grid);
                        timeline.appendChild(block);
                    }
                    grid.appendChild(card(c));
                });
            }

            // Scan viewer
            var box = document.getElementById('lightbox'), boxImg = document.getElementById('lightbox-img');
            function showScan(c) { boxImg.src = c.scan; boxImg.alt = c.title; box.classList.add('show'); }
            function hideScan() { box.classList.remove('show'); boxImg.src = ''; }
            box.addEventListener('click', hideScan);
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideScan(); });

            render();
        })();
    </script>

</body>
</html>
